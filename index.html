<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookshelf Inspector</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Bookshelf Inspector</h1>
    </header>

    <div class="tabs">
        <button class="tab-btn active" id="btn-tab-books">Books Catalog</button>
        <button class="tab-btn" id="btn-tab-authors">Featured Authors</button>
    </div>

    <div class="search-wrapper">
        <input 
            type="text" 
            id="search-input" 
            placeholder="Search by title, author, or ISBN..." 
            autocomplete="off"
        >
        <div id="results-count" class="results-count"></div>
    </div>

    <!-- Container Carti -->
    <section id="books-section" class="view-section">
        <div id="books-container" class="cards-list"></div>
    </section>

    <!-- Container Autori -->
    <section id="authors-section" class="view-section hidden">
        <div id="authors-container" class="cards-list"></div>
    </section>

    <!-- Trigger pentru infinite scroll -->
    <div id="scroll-sentinel" class="sentinel">
        <span id="loading-indicator" class="loading-indicator hidden">Loading more...</span>
        <span id="end-message" class="end-message hidden">You have reached the end of the list.</span>
    </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
